# Include inside server.dalifin.com's HTTPS vhost, before its Host catch-all.
ProxyPass /audio-test/v1/ http://127.0.0.1:15050/v1/ retry=0 connectiontimeout=5 timeout=120
ProxyPassReverse /audio-test/v1/ http://127.0.0.1:15050/v1/
ProxyPass /audio-test/health/live http://127.0.0.1:15050/health/live retry=0 connectiontimeout=5 timeout=10
ProxyPassReverse /audio-test/health/live http://127.0.0.1:15050/health/live
<Location /audio-test/>
    LimitRequestBody 23068672
    Header always set X-Dali-Audio-Environment "us3-test"
</Location>
