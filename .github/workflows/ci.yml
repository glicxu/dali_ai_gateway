name: AI Gateway CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m black --check app tests scripts
      - run: python -m compileall -q app tests
      - run: python -m pytest -q
      - run: python -m scripts.export_openapi --check

